name: CrossCheck CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crosscheck-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline tests and notebook validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-local.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-local.txt

      - name: Run offline workflow and corpus tests
        run: python -m unittest discover -s tests -v

      - name: Validate notebook and embedded source
        run: python scripts/check_notebook.py
